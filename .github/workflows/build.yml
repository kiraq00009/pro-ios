name: iOS build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Logic tests
        run: |
          ok=1
          for T in $(ls Tests); do
            A=$(cat Tests/$T/app.txt)
            echo "== $T"
            swiftc -O $A/Model/*.swift Tests/$T/main.swift -o /tmp/t_$T > test-$T.log 2>&1
            if [ $? -ne 0 ]; then echo "::error::$T compile failed"; tail -40 test-$T.log; ok=0; continue; fi
            /tmp/t_$T >> test-$T.log 2>&1 || { echo "::error::$T tests failed"; tail -40 test-$T.log; ok=0; }
          done
          test $ok = 1

      - name: Generate project (XcodeGen)
        run: brew install xcodegen && xcodegen generate

      - name: Build + package (unsigned)
        run: |
          ok=1
          for APP in $(cat apps.txt); do
            xcodebuild -project Pro.xcodeproj -scheme $APP -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              SYMROOT="$PWD/build" build > build-$APP.log 2>&1 || true
            grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-$APP.log | sort -u | head -60 || true
            if grep -q "BUILD SUCCEEDED" build-$APP.log && test -d build/Release-iphoneos/$APP.app; then
              rm -rf Payload && mkdir -p Payload && cp -R build/Release-iphoneos/$APP.app Payload/
              zip -qry $APP-unsigned.ipa Payload
            else
              echo "::error::$APP failed"; ok=0
            fi
          done
          test $ok = 1

      - name: Simulator screenshots
        if: always()
        run: |
          set +e
          mkdir -p shots
          DEV=$(xcrun simctl create shots "iPhone 16")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          for APP in $(cat apps.txt); do
            xcodebuild -project Pro.xcodeproj -scheme $APP -configuration Debug -sdk iphonesimulator \
              -destination "id=$DEV" CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build-sim" build > sim-$APP.log 2>&1
            grep -E "error:|BUILD (SUCCEEDED|FAILED)" sim-$APP.log | sort -u | head -20
            xcrun simctl install "$DEV" build-sim/Debug-iphonesimulator/$APP.app
          done
          while read APP BID SCREEN; do
            [ -z "$APP" ] && continue
            SIMCTL_CHILD_SHOT=$SCREEN xcrun simctl launch "$DEV" $BID >/dev/null
            sleep 5
            xcrun simctl io "$DEV" screenshot "shots/$APP-$SCREEN.png" >/dev/null 2>&1
            xcrun simctl terminate "$DEV" $BID >/dev/null 2>&1
          done < shots.txt
          sips -Z 1100 shots/*.png >/dev/null 2>&1
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pro-iOS
          path: |
            *-unsigned.ipa
            build-*.log
            test-*.log
            sim-*.log
            shots

# تطبيقات آيفون كبيرة — مشروع واحد (XcodeGen)، بناء سحابيّ + صور شاشات من المحاكي
name: Pro
options:
  bundleIdPrefix: app.pro
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
settingGroups:
  common:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  Dawri:
    type: application
    platform: iOS
    sources: [Dawri, Kit]
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pro.dawri
        PRODUCT_NAME: Dawri
        INFOPLIST_KEY_CFBundleDisplayName: "دوري"
  Player:
    type: application
    platform: iOS
    sources: [Player, Kit]
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pro.player
        PRODUCT_NAME: Player
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Player/Info.plist
      properties:
        CFBundleDisplayName: "بلاير"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [vlc-x-callback]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  Waraq:
    type: application
    platform: iOS
    sources: [Waraq, Kit]
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pro.waraq
        PRODUCT_NAME: Waraq
        INFOPLIST_KEY_CFBundleDisplayName: "ورق"
        INFOPLIST_KEY_NSCameraUsageDescription: "تمسح الأوراق بالكاميرا وتحوّلها لملفّ PDF. كلّشي يبقى على جهازك."
  Dera:
    type: application
    platform: iOS
    sources: [Dera, Kit]
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pro.dera
        PRODUCT_NAME: Dera
        INFOPLIST_KEY_CFBundleDisplayName: "درع"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "نتأكّد إذا بصمة الوجه مفعّلة على جهازك ضمن فحص الأمان."
  Qafza:
    type: application
    platform: iOS
    sources: [Qafza, Kit]
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pro.qafza
        PRODUCT_NAME: Qafza
        INFOPLIST_KEY_CFBundleDisplayName: "قفزة"
  Shuaa:

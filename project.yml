      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pro.maghara
        PRODUCT_NAME: Maghara
        INFOPLIST_KEY_CFBundleDisplayName: "مغارة"
  Shabaka:
    type: application
    platform: iOS
    sources: [Shabaka, Kit]
    settings:
      groups: [common]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pro.shabaka
        PRODUCT_NAME: Shabaka
        INFOPLIST_KEY_CFBundleDisplayName: "شبكة"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "نفحص الأجهزة والمنافذ على شبكتك المحليّة. كلّ الفحص يصير على جهازك."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "iOS يطلب الموقع حتى نبيّنلك اسم شبكة الواي‑فاي (SSID) المتّصل بيها."
  Shifra:
